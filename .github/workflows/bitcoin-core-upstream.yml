name: Bitcoin Core v32.1 native UNITED build

on:
  pull_request:
    branches:
      - consensus/bitcoin-core-32.1-migration
    paths:
      - ".github/workflows/bitcoin-core-upstream.yml"
      - "core/upstream.lock.toml"
      - "core/patches/**"
      - "scripts/bootstrap-bitcoin-core.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-united-regtest:
    name: Clone, patch, compile and smoke-test UNITED regtest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout UNITED integration branch
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 libevent-dev libboost-dev
      - name: Clone Bitcoin Core source
        run: |
          git clone --no-checkout https://github.com/bitcoin/bitcoin.git upstream
          cd upstream
          git fetch --force --tags origin v32.1
      - name: Verify exact pinned tag object and commit
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          expected_tag="$(sed -nE 's/^tag_object = "([^"]+)".*/\1/p' ../core/upstream.lock.toml)"
          expected_commit="$(sed -nE 's/^commit = "([^"]+)".*/\1/p' ../core/upstream.lock.toml)"
          actual_tag="$(git rev-parse 'v32.1^{tag}')"
          actual_commit="$(git rev-parse 'v32.1^{commit}')"
          test "$actual_tag" = "$expected_tag"
          test "$actual_commit" = "$expected_commit"
          git checkout --detach "$expected_commit"
          git show -s --format='Pinned upstream commit: %H%n%s' HEAD
      - name: Apply UNITED native C++ patch
        run: |
          cd upstream
          git apply --check ../core/patches/0001-add-united-regtest.patch
          git apply ../core/patches/0001-add-united-regtest.patch
      - name: Configure minimal daemon build
        run: |
          cmake -S upstream -B upstream/build -G Ninja \
            -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_GUI=OFF \
            -DBUILD_TX=OFF -DBUILD_UTIL=OFF -DENABLE_WALLET=OFF \
            -DENABLE_IPC=OFF -DENABLE_EXTERNAL_SIGNER=OFF \
            -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Compile native daemon and CLI
        run: cmake --build upstream/build --parallel 2
      - name: Start UNITED native regtest and verify genesis
        shell: bash
        run: |
          set -euo pipefail
          datadir="$(mktemp -d)"
          cleanup() {
            upstream/build/bin/bitcoin-cli -chain=unitedregtest -datadir="$datadir" -rpcuser=unitedci -rpcpassword=ci-secret stop >/dev/null 2>&1 || true
            rm -rf "$datadir"
          }
          trap cleanup EXIT
          upstream/build/bin/bitcoind -chain=unitedregtest -datadir="$datadir" -daemon=1 -rpcuser=unitedci -rpcpassword=ci-secret
          actual=""
          for attempt in $(seq 1 30); do
            actual="$(upstream/build/bin/bitcoin-cli -chain=unitedregtest -datadir="$datadir" -rpcuser=unitedci -rpcpassword=ci-secret getblockhash 0 2>/dev/null || true)"
            if [[ -n "$actual" ]]; then break; fi
            sleep 1
          done
          expected="2739e631581bbb86a9dfe9827c2ba84ff1ca53a96e0fbaa809784b351540c44a"
          test "$actual" = "$expected"
          upstream/build/bin/bitcoin-cli -chain=unitedregtest -datadir="$datadir" -rpcuser=unitedci -rpcpassword=ci-secret getblockchaininfo
      - name: Record compiled binaries
        run: |
          find upstream/build/bin -maxdepth 1 -type f -printf '%f\n' | sort
