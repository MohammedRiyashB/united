name: Bitcoin Core v32.1 upstream build

on:
  pull_request:
    branches:
      - consensus/bitcoin-core-32.1-migration
    paths:
      - ".github/workflows/bitcoin-core-upstream.yml"
      - "core/upstream.lock.toml"
      - "scripts/bootstrap-bitcoin-core.sh"
      - "core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-source-build:
    name: Clone, pin-check and build upstream v32.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout UNITED integration branch
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3             libevent-dev libboost-dev
      - name: Clone Bitcoin Core source
        run: |
          git clone --no-checkout https://github.com/bitcoin/bitcoin.git upstream
          cd upstream
          git fetch --force --tags origin v32.1
      - name: Verify exact pinned tag object and commit
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          expected_tag="$(sed -nE 's/^tag_object = "([^"]+)".*/\1/p' ../core/upstream.lock.toml)"
          expected_commit="$(sed -nE 's/^commit = "([^"]+)".*/\1/p' ../core/upstream.lock.toml)"
          actual_tag="$(git rev-parse 'v32.1^{tag}')"
          actual_commit="$(git rev-parse 'v32.1^{commit}')"
          test "$actual_tag" = "$expected_tag"
          test "$actual_commit" = "$expected_commit"
          git checkout --detach "$expected_commit"
          git show -s --format='Pinned upstream commit: %H%n%s' HEAD
      - name: Apply UNITED native regtest patch
        run: |
          cd upstream
          git apply --check ../core/patches/0001-add-united-regtest.patch
          git apply ../core/patches/0001-add-united-regtest.patch
      - name: Configure upstream build
        run: |
          cmake -S upstream -B upstream/build -G Ninja             -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_GUI=OFF             -DWITH_ZMQ=OFF -DWITH_USDT=OFF
      - name: Compile upstream daemon and CLI
        run: |
          cmake --build upstream/build --parallel 2
      - name: Record upstream build outputs
        run: |
          find upstream/build/bin -maxdepth 1 -type f -printf '%f\n' | sort
