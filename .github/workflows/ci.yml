name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-reference-model:
    name: Go reference model
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
      - name: Build CLI
        run: go build ./cmd/united-params ./cmd/united-powdemo
      - name: Check browser P2P module syntax
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser P2P module syntax
        run: node --check web/p2p/peer.js
      - name: Validate UNITED wallet application module syntax
        run: |
          node --check --input-type=module < web/app/app.js
          node --check --input-type=module < web/app/wallet.js
      - name: Test public-testnet CPU miner serialization
        run: python3 scripts/test-testnet-cpu-miner.py
